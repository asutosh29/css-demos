<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flexbox Demo | HTML/CSS Mastery</title>
    <link rel="stylesheet" href="/src/styles/global.css">
    <link rel="stylesheet" href="/src/styles/flexbox.css">
  </head>
  <body>
    <div class="container">
      <a href="/" class="back-link">&larr; Back to Menu</a>
      
      <div class="header">
        <h1>Flexbox (1D Layouts)</h1>
        <p>Master one-dimensional layouts by controlling alignment, direction, and wrapping of child elements.</p>
      </div>

      <div class="layout-grid">
        <!-- Controls Sidebar -->
        <div class="card controls-sidebar">
          <h3>Flex Container Properties</h3>
          
          <div class="control-group">
            <label for="flexDirection">flex-direction</label>
            <select id="flexDirection" class="select-input">
              <option value="row">row (default)</option>
              <option value="row-reverse">row-reverse</option>
              <option value="column">column</option>
              <option value="column-reverse">column-reverse</option>
            </select>
          </div>
          
          <div class="control-group">
            <label for="justifyContent">justify-content</label>
            <select id="justifyContent" class="select-input">
              <option value="flex-start">flex-start (default)</option>
              <option value="flex-end">flex-end</option>
              <option value="center">center</option>
              <option value="space-between">space-between</option>
              <option value="space-around">space-around</option>
              <option value="space-evenly">space-evenly</option>
            </select>
          </div>
          
          <div class="control-group">
            <label for="alignItems">align-items</label>
            <select id="alignItems" class="select-input">
              <option value="stretch">stretch (default)</option>
              <option value="flex-start">flex-start</option>
              <option value="flex-end">flex-end</option>
              <option value="center">center</option>
              <option value="baseline">baseline</option>
            </select>
          </div>
          
          <div class="control-group">
            <label for="flexWrap">flex-wrap</label>
            <select id="flexWrap" class="select-input">
              <option value="nowrap">nowrap (default)</option>
              <option value="wrap">wrap</option>
              <option value="wrap-reverse">wrap-reverse</option>
            </select>
          </div>

          <div class="control-group">
            <label for="gapRange">gap: <span id="gapVal">16</span>px</label>
            <input type="range" id="gapRange" min="0" max="64" value="16">
          </div>
          
          <div class="actions">
            <button id="addItemBtn" class="btn btn-sm">Add Item</button>
            <button id="removeItemBtn" class="btn btn-secondary btn-sm">Remove Item</button>
          </div>
        </div>

        <!-- Visualizer Area -->
        <div class="demo-area flex-visualizer card">
          <div class="flex-container" id="flexContainer">
            <div class="flex-item">1</div>
            <div class="flex-item">2</div>
            <div class="flex-item">3</div>
            <div class="flex-item">4</div>
          </div>
        </div>
      </div>

    </div>
    
    <script type="module" src="/src/scripts/flexbox.js"></script>
  </body>
</html>
